<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinWise</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinWise">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#0b0d10;--card:#151a20;--card2:#1d242c;--tx:#f2efe6;--mut:#8f98a3;--gold:#e8b84a;--gold2:#a8801f;--grn:#38c98a;--red:#ef5b5b;--bd:#262e37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f2ea;--card:#fff;--card2:#efe9d8;--tx:#1b1a17;--mut:#6b6558;--bd:#e3dcc8}}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.gold{background:linear-gradient(135deg,#f3cf72,#b8891f);color:#1b1405}
h2{font-size:15px;margin-bottom:10px}.mut{color:var(--mut);font-size:12px}.big{font-size:28px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:linear-gradient(135deg,#f3cf72,#b8891f);color:#1b1405;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.o{background:var(--card2);color:var(--tx)}
input,select{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:11px;margin:5px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;cursor:pointer}
nav button b{display:block;font-size:20px}nav button.on{color:var(--gold)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0,#3a2d0c,#0b0d10 60%);color:#f2efe6}
#login .box{width:100%;max-width:380px;text-align:center}
#login input{background:#1a1f26;border-color:#2c3540}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);margin-right:6px;animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.hide{display:none!important}
</style></head><body>
<div id="login"><div class="box">
<svg width="120" height="120" viewBox="-40 -40 80 80" aria-label="Logo semanggi"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cf72"/><stop offset="1" stop-color="#a8801f"/></linearGradient></defs>
<g fill="url(#g)"><path id="lf" d="M0,0C-12,-9 -17,-26 -7,-31C-3,-33 0,-28 0,-26C0,-28 3,-33 7,-31C17,-26 12,-9 0,0Z"/><use href="#lf" transform="rotate(72)"/><use href="#lf" transform="rotate(144)"/><use href="#lf" transform="rotate(216)"/><use href="#lf" transform="rotate(288)"/></g></svg>
<h1 style="margin:8px 0 2px;font-size:30px;letter-spacing:1px">FinWise</h1>
<p style="color:#8f98a3;font-size:13px;margin-bottom:18px">Kelola uang. Tabung emas. Jadi yang terbaik.</p>
<input id="lu" placeholder="Nama pengguna" autocomplete="username"><input id="lp" type="password" placeholder="Kata sandi" autocomplete="current-password">
<p id="le" style="color:#ef5b5b;font-size:13px;min-height:18px"></p>
<button class="btn" style="width:100%" onclick="auth(1)">Masuk</button>
<button class="btn o" style="width:100%;margin-top:8px;background:#1a1f26;color:#f2efe6" onclick="auth(0)">Daftar akun baru</button>
<p style="color:#6b7480;font-size:11px;margin-top:14px">Data tersimpan di perangkat ini.</p></div></div>
<div id="app" class="hide"><div class="wrap" id="v"></div>
<nav><button data-t="home"><b>🏠</b>Beranda</button><button data-t="tx"><b>💸</b>Transaksi</button><button data-t="gold"><b>🪙</b>Emas</button><button data-t="plan"><b>🎯</b>Rencana</button><button data-t="rep"><b>📊</b>Laporan</button></nav></div>
<script>
const $=s=>document.querySelector(s),R=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const CAT=["Makan","Transport","Belanja","Tagihan","Hiburan","Kesehatan","Lainnya"],INC=["Gaji","Bonus","Usaha","Lainnya"];
let S,U,tab="home",P=2450000,H=[];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function save(){sv("fw_d_"+U,S)}
function auth(login){const u=$("#lu").value.trim(),p=$("#lp").value,us=ld("fw_users",{});
 if(!u||p.length<4){$("#le").textContent="Isi nama dan sandi (min. 4 karakter).";return}
 if(login){if(us[u]!==btoa(p)){$("#le").textContent="Nama atau sandi salah.";return}}
 else{if(us[u]){$("#le").textContent="Nama sudah dipakai.";return}us[u]=btoa(p);sv("fw_users",us)}
 sv("fw_sess",u);start(u)}
function start(u){U=u;S=ld("fw_d_"+u,{tx:[],bud:{Makan:1500000,Transport:500000,Belanja:800000,Tagihan:1000000,Hiburan:400000},gold:{g:0,cost:0},goals:[]});
 P=ld("fw_price",{p:2450000}).p;H=ld("fw_hist",[]);if(!H.length)for(let i=0;i<30;i++){P*=1+(Math.random()-.5)*.006;H.push(P)}
 $("#login").classList.add("hide");$("#app").classList.remove("hide");go("home")}
function out(){sv("fw_sess","");location.reload()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));draw()}
const mk=d=>d.slice(0,7),now=()=>new Date().toISOString().slice(0,10);
function sums(m){let i=0,o=0;S.tx.forEach(t=>{if(!m||mk(t.d)==m){t.k=="in"?i+=t.a:o+=t.a}});return{i,o}}
function donut(m){const by={};S.tx.filter(t=>t.k=="out"&&mk(t.d)==m).forEach(t=>by[t.c]=(by[t.c]||0)+t.a);const tot=Object.values(by).reduce((a,b)=>a+b,0);
 if(!tot)return'<p class="mut">Belum ada pengeluaran bulan ini.</p>';const cs=["#e8b84a","#38c98a","#5b9bef","#ef5b5b","#b072e8","#f08a4b","#8f98a3"];let off=0,r=40,C=2*Math.PI*r,s="",l="";
 Object.entries(by).forEach(([k,v],i)=>{const f=v/tot*C;s+=`<circle r="${r}" fill="none" stroke="${cs[i%7]}" stroke-width="16" stroke-dasharray="${f} ${C-f}" stroke-dashoffset="${-off}"/>`;off+=f;l+=`<div class="row mut" style="margin:3px 0"><span><span style="color:${cs[i%7]}">●</span> ${k}</span><span>${R(v)}</span></div>`});
 return`<div class="row" style="align-items:flex-start"><svg width="120" height="120" viewBox="-50 -50 100 100" style="transform:rotate(-90deg)">${s}</svg><div style="flex:1">${l}</div></div>`}
function spark(){const mn=Math.min(...H),mx=Math.max(...H),w=300,h=60;return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="60"><polyline fill="none" stroke="#1b1405" stroke-width="2" points="${H.map((v,i)=>(i/(H.length-1)*w)+","+(h-4-(v-mn)/(mx-mn||1)*(h-8))).join(" ")}"/></svg>`}
function draw(){const m=now().slice(0,7),s=sums(m),v=$("#v"),all=sums(),G=S.gold,gv=G.g*P;let h="";
 if(tab=="home"){h=`<div class="row"><div><div class="mut">Halo,</div><h2 style="font-size:20px;margin:0">${U} 🍀</h2></div><button class="btn o" onclick="out()">Keluar</button></div><br>
 <div class="card gold"><div style="opacity:.7;font-size:12px">Total kekayaan</div><div class="big">${R(all.i-all.o+gv)}</div><div style="font-size:12px;opacity:.75">Kas ${R(all.i-all.o)} · Emas ${R(gv)}</div></div>
 <div class="g2"><div class="card"><div class="mut">Pemasukan bulan ini</div><b class="pos">${R(s.i)}</b></div><div class="card"><div class="mut">Pengeluaran bulan ini</div><b class="neg">${R(s.o)}</b></div></div>
 <div class="card"><h2>Pengeluaran per kategori</h2>${donut(m)}</div>
 <div class="card"><h2>Terbaru</h2>${S.tx.slice(-4).reverse().map(row).join("")||'<p class="mut">Belum ada transaksi.</p>'}</div>`}
 if(tab=="tx"){h=`<div class="card"><h2>Tambah transaksi</h2><div class="g2"><select id="k" onchange="kk()"><option value="out">Pengeluaran</option><option value="in">Pemasukan</option></select><select id="c">${CAT.map(c=>`<option>${c}</option>`)}</select></div><input id="a" type="number" inputmode="numeric" placeholder="Jumlah (Rp)"><input id="n" placeholder="Catatan"><input id="d" type="date" value="${now()}"><button class="btn" style="width:100%;margin-top:6px" onclick="addTx()">Simpan</button></div>
 <div class="card"><h2>Riwayat</h2><input id="q" placeholder="Cari catatan/kategori" oninput="flt()"><div id="lst">${S.tx.slice().reverse().map(row).join("")||'<p class="mut">Kosong.</p>'}</div></div>`}
 if(tab=="gold"){const pl=gv-G.cost;h=`<div class="card gold"><div class="row"><span style="font-size:12px"><span class="live"></span>Harga emas per gram (otomatis)</span><span id="ts" style="font-size:11px;opacity:.7"></span></div><div class="big" id="gp">${R(P)}</div>${spark()}</div>
 <div class="g2"><div class="card"><div class="mut">Emas saya</div><b>${G.g.toFixed(3)} g</b><div class="mut">${R(gv)}</div></div><div class="card"><div class="mut">Untung/rugi</div><b class="${pl>=0?"pos":"neg"}">${pl>=0?"+":""}${R(pl)}</b><div class="mut">Modal ${R(G.cost)}</div></div></div>
 <div class="card"><h2>Beli / jual emas</h2><input id="gg" type="number" step="0.001" placeholder="Jumlah gram"><div class="g2"><button class="btn" onclick="gold(1)">Beli</button><button class="btn o" onclick="gold(0)">Jual</button></div></div>
 <div class="card"><h2>Target emas</h2><p class="mut">10 gram = ${R(10*P)}. Progres kamu ${(G.g/10*100).toFixed(0)}%</p><div class="bar"><i style="width:${Math.min(100,G.g*10)}%"></i></div></div>`}
 if(tab=="plan"){const by={};S.tx.filter(t=>t.k=="out"&&mk(t.d)==m).forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
 h=`<div class="card"><h2>Anggaran bulanan</h2>${CAT.slice(0,6).map(c=>{const b=S.bud[c]||0,u=by[c]||0,p=b?u/b*100:0;return`<div style="margin-bottom:12px"><div class="row"><span>${c}</span><span class="mut ${p>100?"neg":""}">${R(u)} / <a onclick="setB('${c}')" style="text-decoration:underline">${R(b)}</a></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>100?"var(--red)":p>80?"#f08a4b":"var(--gold)"}"></i></div></div>`}).join("")}<p class="mut">Ketuk angka batas untuk mengubah.</p></div>
 <div class="card"><h2>Target tabungan</h2>${S.goals.map((g,i)=>`<div style="margin-bottom:12px"><div class="row"><b>${g.n}</b><button class="x" onclick="S.goals.splice(${i},1);save();draw()">✕</button></div><div class="mut">${R(g.s)} / ${R(g.t)}</div><div class="bar"><i style="width:${Math.min(100,g.s/g.t*100)}%"></i></div><button class="btn o" style="margin-top:6px;padding:6px 12px" onclick="addG(${i})">+ Setor</button></div>`).join("")||'<p class="mut">Belum ada target.</p>'}<input id="gn" placeholder="Nama target (mis. Liburan)"><input id="gt" type="number" placeholder="Jumlah target (Rp)"><button class="btn" style="width:100%" onclick="newG()">Tambah target</button></div>`}
 if(tab=="rep"){const ms=[...new Set(S.tx.map(t=>mk(t.d)).concat(m))].sort().slice(-6),dat=ms.map(x=>({x,...sums(x)})),mx=Math.max(1,...dat.map(d=>Math.max(d.i,d.o)));
 h=`<div class="card"><h2>Laporan bulanan</h2>${dat.map(d=>`<div style="margin-bottom:14px"><div class="row"><b>${d.x}</b><span class="mut">Selisih <span class="${d.i-d.o>=0?"pos":"neg"}">${R(d.i-d.o)}</span></span></div><div class="bar"><i style="width:${d.i/mx*100}%;background:var(--grn)"></i></div><div class="bar"><i style="width:${d.o/mx*100}%;background:var(--red)"></i></div></div>`).join("")}<p class="mut">Hijau pemasukan, merah pengeluaran.</p></div>
 <div class="card"><h2>Ringkasan ${m}</h2><div class="row"><span>Rasio tabungan</span><b>${s.i?Math.max(0,(s.i-s.o)/s.i*100).toFixed(0):0}%</b></div><br><button class="btn o" style="width:100%" onclick="csv()">Unduh data (CSV)</button></div>`}
 v.innerHTML=h;if(tab=="tx")kk()}
function row(t){return`<div class="item"><div><div>${t.c}${t.n?" · "+t.n:""}</div><div class="mut">${t.d}</div></div><div><b class="${t.k=="in"?"pos":"neg"}">${t.k=="in"?"+":"-"}${R(t.a)}</b> <button class="x" onclick="del(${t.id})">✕</button></div></div>`}
function kk(){const c=$("#c");if(!c)return;const l=$("#k").value=="in"?INC:CAT;c.innerHTML=l.map(x=>`<option>${x}</option>`).join("")}
function addTx(){const a=+$("#a").value;if(!(a>0))return;S.tx.push({id:Date.now(),k:$("#k").value,c:$("#c").value,a,n:$("#n").value,d:$("#d").value||now()});S.tx.sort((x,y)=>x.d<y.d?-1:1);save();draw()}
function del(id){S.tx=S.tx.filter(t=>t.id!=id);save();draw()}
function flt(){const q=$("#q").value.toLowerCase();$("#lst").innerHTML=S.tx.filter(t=>(t.c+" "+t.n).toLowerCase().includes(q)).reverse().map(row).join("")}
function gold(b){const g=+$("#gg").value;if(!(g>0))return;const G=S.gold;if(b){G.g+=g;G.cost+=g*P}else{if(g>G.g){alert("Emas tidak cukup.");return}G.cost-=G.cost*(g/G.g);G.g-=g}save();draw()}
function setB(c){const v=prompt("Batas anggaran "+c+" (Rp)",S.bud[c]||0);if(v!==null){S.bud[c]=+v||0;save();draw()}}
function newG(){const n=$("#gn").value.trim(),t=+$("#gt").value;if(n&&t>0){S.goals.push({n,t,s:0});save();draw()}}
function addG(i){const v=+prompt("Jumlah setoran (Rp)");if(v>0){S.goals[i].s+=v;save();draw()}}
function csv(){const t="tanggal,jenis,kategori,jumlah,catatan\n"+S.tx.map(x=>[x.d,x.k,x.c,x.a,'"'+(x.n||"")+'"'].join(",")).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(t);a.download="finwise.csv";a.click()}
// Harga emas: simulasi pembaruan otomatis tiap 5 detik
setInterval(()=>{if(!U)return;P*=1+(Math.random()-.5)*.003;H.push(P);H=H.slice(-30);sv("fw_price",{p:P});sv("fw_hist",H);
 if(tab=="gold"){const e=$("#gp");if(e){e.textContent=R(P);$("#ts").textContent=new Date().toLocaleTimeString("id-ID")}}},5000);
const ss=ld("fw_sess","");if(ss&&ld("fw_users",{})[ss])start(ss);
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))</script></body></html>
